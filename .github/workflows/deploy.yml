name: Deploy production

# Manual deploy to production, run on the self-hosted runner on ioref-web-01.
#
# Pulls an immutable sha-* image from GHCR, retags it locally as the tag the
# Quadlet unit references, and restarts the unit. The mutable `production` tag
# exists only on that host, so the registry stays a record of what was built.
#
# Deliberately does not check out the repository, and does not log in to
# GHCR. The deploy needs an image name and nothing else: the package is
# public, so `podman pull` needs no credential, and the runner reaches GitHub
# through a proxy with a narrow allowlist, so every avoided request is one
# fewer thing to get allowed there.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy. Defaults to the selected ref. Use this to roll back."
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ioref/ioref-inventory
  UNIT: ioref-inventory-production.service
  LOCAL_TAG: localhost/ioref-inventory:production
  HTTP_PROXY: http://proxy.andrew.cmu.edu:3128
  HTTPS_PROXY: http://proxy.andrew.cmu.edu:3128
  NO_PROXY: .cmu.edu,.cmu.local,localhost,127.0.0.1

jobs:
  deploy:
    # Targeted by the label the runner is registered with (see DEPLOYMENT.md),
    # not bare self-hosted, so a second self-hosted runner added for something
    # else can never pick up a production deploy by accident.
    runs-on: [self-hosted, linux, ioref-inventory-production]
    environment: production
    permissions:
      contents: read

    steps:
      # Every podman and systemctl --user call below needs this. The runner
      # service runs as `deploy` but as a plain systemd unit, not a login
      # session, so it is not guaranteed to inherit the XDG_RUNTIME_DIR a
      # real session gets, and that path is where the Quadlet's rootless
      # podman keeps its running containers. Set once, inherited by every
      # step after this one via GITHUB_ENV.
      - name: Pin the podman and systemd environment
        run: echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Resolve the image to deploy
        id: target
        run: |
          SHA="${{ inputs.sha || github.sha }}"
          echo "ref=${IMAGE}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}:sha-${SHA}"

      - name: Resolve the container name
        id: container
        run: |
          # Quadlet names the container systemd-<unit-basename> unless the
          # .container file sets ContainerName= itself, so guessing $UNIT's
          # basename here is a bet that can quietly be wrong. Quadlet does
          # always attach a PODMAN_SYSTEMD_UNIT label matching the unit, so
          # look the name up rather than assume it: a wrong guess makes every
          # later step below fail with "no such container" regardless of
          # whether the deploy actually worked, which is exactly what rolled
          # back a healthy container before this was added.
          NAME="$(podman ps -a --filter "label=PODMAN_SYSTEMD_UNIT=$UNIT" --format '{{.Names}}' | head -1)"
          if [ -z "$NAME" ]; then
            echo "::error::No container carries the label PODMAN_SYSTEMD_UNIT=$UNIT. Is the Quadlet unit installed and named as expected?"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Record what is running now
        id: current
        run: |
          # The image ID, not the manifest digest: an ID is always a valid
          # local `podman tag` source, a bare digest is not reliably one.
          # Captured before anything moves, so a failed deploy can put it back.
          echo "id=$(podman image inspect "$LOCAL_TAG" \
            --format '{{.Id}}' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Pull
        run: podman pull "${{ steps.target.outputs.ref }}"

      - name: Retag and restart
        run: |
          podman tag "${{ steps.target.outputs.ref }}" "$LOCAL_TAG"
          systemctl --user restart "$UNIT"

      - name: Wait for health
        id: health
        run: |
          # The image's own healthcheck, so this asks the container the same
          # question podman does rather than inventing a second definition.
          CONTAINER="${{ steps.container.outputs.name }}"
          for attempt in $(seq 1 30); do
            if podman healthcheck run "$CONTAINER" >/dev/null 2>&1; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Never became healthy. Last 50 log lines:"
          podman logs --tail 50 "$CONTAINER" || true
          exit 1

      - name: Roll back
        if: failure() && steps.health.outcome == 'failure' && steps.current.outputs.id != ''
        run: |
          echo "::warning::Restoring ${{ steps.current.outputs.id }}"
          podman tag "${{ steps.current.outputs.id }}" "$LOCAL_TAG"
          systemctl --user restart "$UNIT"

      - name: Report
        if: always()
        run: |
          {
            echo "### ${{ job.status }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.target.outputs.ref }}\` |"
            echo "| Previous | \`${{ steps.current.outputs.id || 'none' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

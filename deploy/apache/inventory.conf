# Apache + mod_shib in front of ioref-inventory (AUTH_MODE=shib).
#
# Follows the pattern already used for guides.ioref.org: Apache terminates TLS
# and reverse-proxies to the app on localhost. The difference is that this vhost
# also terminates SAML and passes the resolved identity downstream.

<VirtualHost *:80>
  ServerName inventory.ioref.org
  Redirect permanent "/" "https://inventory.ioref.org/"
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName inventory.ioref.org

  ProxyRequests Off
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"

  # =========================================================================
  # CRITICAL: clear the identity headers on every inbound request before
  # Shibboleth sets them.
  #
  # accounts/backends.py trusts these headers completely. Without this block a
  # client can simply send `Remote-User: someone-else` and be authenticated as
  # them. `unset` runs against the *client-supplied* request, and mod_shib
  # repopulates them afterwards from the actual SAML session, so authentic
  # values survive and forged ones do not.
  # =========================================================================
  RequestHeader unset Remote-User
  RequestHeader unset Mail
  RequestHeader unset Displayname

  # The app must not be reachable except through this vhost. Bind gunicorn to
  # 127.0.0.1 (or keep the container port unpublished and proxy over the compose
  # network) -- if port 8000 is reachable directly, the unset above buys nothing.

  <Location />
    AuthType shibboleth
    ShibRequestSetting requireSession 0
    Require shibboleth
  </Location>

  # Staff-only areas require a live session; the public read API does not.
  <Location /admin>
    AuthType shibboleth
    ShibRequestSetting requireSession 1
    Require valid-user
  </Location>

  # Service callers authenticate with a Bearer key, so forcing a SAML session
  # here would break the frontdoor.
  <Location /api>
    ShibRequestSetting requireSession 0
    Require all granted
  </Location>

  <Location /Shibboleth.sso>
    ProxyPass !
    SetHandler shib
  </Location>

  ProxyPass        /Shibboleth.sso !
  ProxyPass        / http://127.0.0.1:8000/
  ProxyPassReverse / http://127.0.0.1:8000/

  SSLCertificateFile    /etc/letsencrypt/live/inventory.ioref.org/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/inventory.ioref.org/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

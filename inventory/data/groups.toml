files      = "Hand files"
rings      = "NeoPixel rings"
discs      = "LED discs"
cells      = "Load cells"
gates      = "Logic gates"
registers  = "Shift registers"
timers     = "555 timers"
arrays     = "Transistor arrays"
bits       = "Driver bits"
alarms     = "LiPo alarms"

# ---------------------------------------------------------------------------
# [merge]  derived head -> the group that absorbs it
#
# The mechanical and shop side collapses hard, because the emphasis of the
# guides is electronics. Fasteners is one page covering roughly two hundred
# parts; nobody needs a separate explanation of a locknut.
# ---------------------------------------------------------------------------

[merge]
screws = "Fasteners"
bolts = "Fasteners"
nuts = "Fasteners"
washers = "Fasteners"
locknuts = "Fasteners"
standoffs = "Fasteners"
spacers = "Fasteners"
rods = "Fasteners"
fasteners = "Fasteners"

pliers = "Hand tools"
cutters = "Hand tools"
screwdrivers = "Hand tools"
knifes = "Hand tools"
scissors = "Hand tools"
clamps = "Hand tools"
hammers = "Hand tools"
tweezers = "Hand tools"
vises = "Hand tools"
punches = "Hand tools"
rulers = "Hand tools"
"t-squares" = "Hand tools"
blades = "Hand tools"
files = "Hand tools"
mats = "Hand tools"
brushes = "Hand tools"
tools = "Hand tools"

woods = "Craft materials"
clays = "Craft materials"
papers = "Craft materials"
chipboards = "Craft materials"
felts = "Craft materials"
foils = "Craft materials"
chalks = "Craft materials"
beads = "Craft materials"
straws = "Craft materials"
bands = "Craft materials"
ropes = "Craft materials"
strings = "Craft materials"

"iron tips" = "Soldering supplies"
solders = "Soldering supplies"
sponges = "Soldering supplies"
stands = "Soldering supplies"

microcontrollers = "Microcontroller boards"
micros = "Microcontroller boards"
unos = "Microcontroller boards"
teensies = "Microcontroller boards"
"arduino kits" = "Microcontroller boards"

glasses = "Safety gear"
goggles = "Safety gear"

microswitches = "Lever switches"
# Arcade, panel-mount, latching and metal buttons are one thing you press. The
# tactile pushbuttons stay apart: those are the 6mm parts that go in a
# breadboard, and they have their own card.
buttons = "Pushbuttons"
servos = "Servo motors"
knobs = "Potentiometers"
pushbuttons = "Pushbuttons"
cords = "Cables"
leads = "Cables"
emitters = "Infrared emitters and detectors"
"effect sensors" = "Hall effect sensors"

# ---------------------------------------------------------------------------
# [drop]  heads that name no topic
#
# Storage furniture is not a part anyone needs explained, and the rest are
# artefacts of the derivation reading a specification as a kind.
# ---------------------------------------------------------------------------

[drop]
heads = [
  "drivers",
  "credenzas",
  "drawers",
  "bins",
  "containers",
  "units",
  "diameters",
  "entries",
  "shafts",
  "metals",
  "plastics",
  "threads",
  "boards",
  "pads",
  "monitors",
]

# ---------------------------------------------------------------------------
# [settings]
#
# A group nobody will write a page about is worse than no group: an empty
# heading invites someone to fill it in, where an absent one does not. Groups
# stated above are exempt however small, which is the whole point of stating
# them -- there is one photoresistor and it needs a page.
# ---------------------------------------------------------------------------

[settings]
min_size = 3

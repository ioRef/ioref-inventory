{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
  .quick { max-width: 42rem; }
  .quick-number { font-size: 2.25rem; font-family: monospace; font-weight: 600; width: 10rem; padding: .5rem .75rem; letter-spacing: .08em; border: 1px solid #8a8a8a; border-radius: 6px; background: #fff; color: #1d1d1d; }
  .quick-number:focus { outline: none; border-color: #0c8138; box-shadow: 0 0 0 3px rgba(20, 176, 77, .15); }
  .quick label.field { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .3rem; }
  .card { border: 1px solid #c4c4c4; border-radius: 6px; padding: 1rem 1.25rem; background: #fff; margin-top: 1.25rem; }
  .card h2 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .card .muted { color: #636466; }
  .card dl { display: grid; grid-template-columns: 9rem 1fr; gap: .35rem .75rem; margin: .75rem 0 1rem; font-size: .95rem; }
  .card dt { color: #636466; }
  .card dd { font-weight: 700; color: #1d1d1d; }
  .count-row { display: grid; grid-template-columns: 9rem 1fr 9rem; gap: .5rem .75rem; align-items: center; margin-bottom: .75rem; }
  .count-input { display: flex; align-items: center; gap: .5rem; }
  .count-row input { font-size: 1.25rem; padding: .4rem .6rem; width: 100%; box-sizing: border-box; border: 1px solid #8a8a8a; border-radius: 4px; background: #fff; color: #1d1d1d; }
  .count-row input:focus { outline: none; border-color: #0c8138; box-shadow: 0 0 0 3px rgba(20, 176, 77, .15); }
  .count-row .unit { font-size: 1.1rem; color: #1d1d1d; white-space: nowrap; }
  .count-row .latest { font-size: .85rem; color: #636466; }
  .btn { padding: .5rem 1rem; font-size: .95rem; cursor: pointer; }
  .btn.primary { background: #0c8138; border-color: #0c8138; color: #fff; font-size: 1.05rem; padding: .6rem 1.4rem; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .notice { margin-top: 1rem; padding: .6rem .8rem; border-radius: 4px; }
  .notice.error { background: #fdecee; color: #b00020; }
  .notice.ok { background: #eef8f1; color: #1d1d1d; }
  .last { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; }
  .number-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .camera-btn { min-width: 3.25rem; min-height: 3.25rem; padding: .5rem; display: inline-flex; align-items: center; justify-content: center; background: #fff; color: #1d1d1d; border: 1px solid #636466; border-radius: 6px; }
  .scan-source { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .scanner .viewfinder { width: 100%; max-width: 24rem; aspect-ratio: 1 / 1; margin: 0 auto; }
  .scanner .viewfinder canvas { width: 100%; height: 100%; display: block; background: #111; border-radius: 4px; }
  .scanner .scan-status { margin: .6rem 0 0; font-size: .95rem; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 10000; }
  #flash.flashing { animation: flash-fade .5s ease-out; }
  @keyframes flash-fade { from { opacity: .9; } to { opacity: 0; } }
  .last .last-text { font-size: 1.05rem; line-height: 1.5; flex: 1 1 14rem; }
  #undo-btn { min-height: 2.75rem; min-width: 7rem; padding: .5rem 1.25rem; font-size: 1.05rem; background: #fff; color: #1d1d1d; border: 1px solid #636466; border-radius: 4px; }
  #undo-btn:hover { background: #f2f2f2; }
  @media (max-width: 480px) {
    #undo-btn { width: 100%; }
  }
  @media (max-width: 480px) {
    .count-row { grid-template-columns: 1fr; }
    .card dl { grid-template-columns: 1fr; }
  }
</style>
{% endblock %}

{% block content %}
<div class="quick">
  <label class="field" for="part-number">ioRef part #</label>
  <div class="number-row">
    <input type="text" id="part-number" class="quick-number" inputmode="numeric" maxlength="8" autocomplete="off" autofocus>
    <button type="button" class="btn camera-btn" id="camera-btn" aria-label="Scan a QR code" title="Scan a QR code">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
  </div>

  <section class="card scanner" id="scanner" hidden>
    <div class="viewfinder">
      <canvas id="scan-view" width="480" height="480" aria-label="Camera view. Center the QR code in the circle."></canvas>
    </div>
    <div class="scan-status muted" id="scan-status">Point the camera at a QR code.</div>
  </section>

  <div id="notice"></div>

  <section class="card" id="part-card" hidden>
    <h2 id="short-name"></h2>
    <dl>
      <dt>Description</dt><dd id="description"></dd>
      <dt>Location</dt><dd id="location"></dd>
    </dl>

    <div class="count-row">
      <label for="inventory-update">Update inventory</label>
      <div class="count-input">
        <input type="text" id="inventory-update" inputmode="numeric" placeholder="count">
        <span class="unit" id="inventory-unit"></span>
      </div>
      <div class="latest" id="latest-inventory"></div>
    </div>
    <div class="count-row">
      <label for="backstock-update">Update backstock</label>
      <div class="count-input">
        <input type="text" id="backstock-update" inputmode="numeric" placeholder="count">
        <span class="unit" id="backstock-unit"></span>
      </div>
      <div class="latest" id="latest-backstock"></div>
    </div>

    <button type="button" class="btn primary" id="update-btn" disabled data-url="{% url 'admin:inventory_part_quick_record' %}">Update</button>
  </section>

  <section class="card" id="last-card" hidden>
    <div class="last">
      <div class="last-text" id="last-text"></div>
      <button type="button" class="btn" id="undo-btn" data-url="{% url 'admin:inventory_part_quick_undo' %}">Undo</button>
    </div>
  </section>
</div>

<video id="scan-video" class="scan-source" playsinline muted></video>
<canvas id="scan-decode" hidden></canvas>
<div id="flash" aria-hidden="true"></div>
<input type="hidden" id="lookup-url" value="{% url 'admin:inventory_part_quick_lookup' %}">
<script src="{% static 'inventory/jsqr-1.4.0.min.js' %}"></script>

<script>
(function () {
  const el = (id) => document.getElementById(id);
  const csrf = () => (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || "";
  const VIEW = 480;
  const state = { part: null, last: null, camera: false, stream: null, frame: null, busy: false, pending: false, lastDecode: 0, ignore: null, ignoreUntil: 0, audio: null, detector: null };

  function post(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrf() },
      body: JSON.stringify(body),
    }).then((r) => r.json().then((data) => ({ ok: r.ok, data })));
  }

  function showNotice(text, kind) {
    el("notice").innerHTML = text ? '<div class="notice ' + kind + '"></div>' : "";
    if (text) el("notice").firstChild.textContent = text;
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return (d.getMonth() + 1) + "/" + d.getDate() + "/" + (d.getFullYear() % 100);
  }

  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function unitLabel(unit) {
    return unit && unit !== "each" ? unit : "";
  }

  function latestText(entry) {
    return entry ? entry.text + " as of " + fmtDate(entry.observed_at) : "not counted";
  }

  function hidePart() {
    el("part-card").hidden = true;
    state.part = null;
    el("update-btn").disabled = true;
  }

  function showPart(d) {
    state.part = d;
    el("short-name").textContent = d.part_number + "  " + d.short_name;
    el("description").textContent = d.description || "—";
    el("location").textContent = d.location || "—";
    el("inventory-unit").textContent = unitLabel(d.unit);
    el("backstock-unit").textContent = unitLabel(d.unit);
    el("latest-inventory").textContent = "Latest: " + latestText(d.inventory);
    el("latest-backstock").textContent = "Latest: " + latestText(d.backstock);
    el("inventory-update").value = "";
    el("backstock-update").value = "";
    el("part-card").hidden = false;
    el("update-btn").disabled = true;
  }

  function lookupFailed(message) {
    hidePart();
    showNotice(message, "error");
    return { ok: false, error: message };
  }

  // Resolves to { ok, error }. ok is true when the part was shown. error is the reason, or "" when a newer lookup has replaced this one.
  function lookup(number) {
    if (!number) { hidePart(); return Promise.resolve({ ok: false, error: "" }); }
    return fetch(el("lookup-url").value + "?part_number=" + encodeURIComponent(number), { credentials: "same-origin" })
      .catch(() => { throw new Error("Couldn't reach the inventory server. Check the connection and try again."); })
      .then((r) => {
        if (!(r.headers.get("content-type") || "").includes("application/json")) {
          throw new Error("Got HTTP " + r.status + " instead of part data. Your sign-in may have expired; reload the page to sign in again.");
        }
        return r.json().then((data) => ({ ok: r.ok, data }));
      })
      .then(({ ok, data }) => {
        if (el("part-number").value.trim() !== number) return { ok: false, error: "" };
        if (!ok) return lookupFailed(data.error);
        showNotice("", "");
        showPart(data);
        return { ok: true, error: "" };
      })
      .catch((err) => lookupFailed(err.message));
  }

  function renderLast(d) {
    const parts = d.events.map((e) => e.kind + " " + e.text);
    el("last-text").textContent = "Recorded " + d.part_number + " " + d.short_name + ": " + parts.join(", ") +
      " at " + fmtTime(d.events[0].observed_at) + ".";
    el("last-card").hidden = false;
  }

  el("part-number").addEventListener("input", () => {
    const v = el("part-number").value.trim();
    showNotice("", "");
    if (v.length === 4) lookup(v); else hidePart();
  });
  el("part-number").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); lookup(el("part-number").value.trim()); }
  });

  function syncUpdate() {
    el("update-btn").disabled = !state.part ||
      (el("inventory-update").value.trim() === "" && el("backstock-update").value.trim() === "");
  }
  el("inventory-update").addEventListener("input", syncUpdate);
  el("backstock-update").addEventListener("input", syncUpdate);

  el("update-btn").addEventListener("click", () => {
    if (!state.part) return;
    el("update-btn").disabled = true;
    post(el("update-btn").dataset.url, {
      part_number: state.part.part_number,
      inventory: el("inventory-update").value.trim(),
      backstock: el("backstock-update").value.trim(),
    }).then(({ ok, data }) => {
      if (!ok) { showNotice(data.error, "error"); syncUpdate(); return; }
      state.last = data;
      renderLast(data);
      showNotice("", "");
      if (state.camera) {
        // Back to ready: the camera is still running, so show the preview again.
        state.pending = false;
        state.ignore = data.part_number;
        state.ignoreUntil = Date.now() + 8000;
        hidePart();
        el("part-number").value = "";
        showScanner("Saved. Point the camera at the next QR code.");
        return;
      }
      el("part-number").value = data.part_number;
      lookup(data.part_number);
      el("part-number").focus();
      el("part-number").select();
    });
  });

  el("undo-btn").addEventListener("click", () => {
    if (!state.last) return;
    if (!confirm("Undo this count?")) return;
    post(el("undo-btn").dataset.url, { ids: state.last.events.map((e) => e.id) }).then(({ ok, data }) => {
      if (!ok) { showNotice(data.error, "error"); return; }
      state.last = null;
      el("last-card").hidden = true;
      showNotice("Undone.", "ok");
      if (state.part) lookup(state.part.part_number);
    });
  });

  // QR scanning. A label's text ends in the part number, so the last run of digits is the part.
  function partFromCode(text) {
    const run = (text || "").match(/(\d+)\D*$/);
    if (!run || run[1].length < 4) return null;
    return run[1].slice(-4);
  }

  function setScanStatus(text) { el("scan-status").textContent = text; }

  function showScanner(text) {
    el("scanner").hidden = false;
    setScanStatus(text);
  }

  // The preview shows the center of the frame: a square whose side is half the shorter side.
  function cropOf(video) {
    const crop = Math.min(video.videoWidth, video.videoHeight) / 2;
    return { crop: crop, sx: (video.videoWidth - crop) / 2, sy: (video.videoHeight - crop) / 2 };
  }

  // The target circle is half the diameter of the crop. Pixels outside it are shown but never read.
  function drawView() {
    const video = el("scan-video");
    if (!video.videoWidth) return;
    const c = cropOf(video);
    const ctx = el("scan-view").getContext("2d");
    ctx.drawImage(video, c.sx, c.sy, c.crop, c.crop, 0, 0, VIEW, VIEW);
    ctx.beginPath();
    ctx.arc(VIEW / 2, VIEW / 2, VIEW / 4, 0, 2 * Math.PI);
    ctx.lineWidth = 6;
    ctx.strokeStyle = "rgba(0, 0, 0, .6)";
    ctx.stroke();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
  }

  // Reads only the pixels inside the target circle. Everything outside it is painted white first.
  function decodeTarget() {
    const video = el("scan-video");
    if (!video.videoWidth) return Promise.resolve(null);
    const d = Math.round(cropOf(video).crop / 2);
    const r = d / 2;
    const canvas = el("scan-decode");
    canvas.width = d; canvas.height = d;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(video, video.videoWidth / 2 - r, video.videoHeight / 2 - r, d, d, 0, 0, d, d);
    const image = ctx.getImageData(0, 0, d, d);
    const px = image.data;
    for (let y = 0; y < d; y++) {
      for (let x = 0; x < d; x++) {
        const dx = x + 0.5 - r, dy = y + 0.5 - r;
        if (dx * dx + dy * dy > r * r) {
          const i = (y * d + x) * 4;
          px[i] = px[i + 1] = px[i + 2] = 255;
        }
      }
    }
    ctx.putImageData(image, 0, 0);
    if (window.BarcodeDetector) {
      if (!state.detector) state.detector = new BarcodeDetector({ formats: ["qr_code"] });
      return state.detector.detect(canvas).then((codes) => (codes[0] ? codes[0].rawValue : null)).catch(() => null);
    }
    if (!window.jsQR) return Promise.resolve(null);
    const code = window.jsQR(px, d, d);
    return Promise.resolve(code ? code.data : null);
  }

  function beep() {
    const ctx = state.audio;
    if (!ctx) return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 1050;
      gain.gain.value = 0.2;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (err) { /* audio is an extra; the flash still shows */ }
  }

  function flash() {
    const f = el("flash");
    f.classList.remove("flashing");
    void f.offsetWidth;
    f.classList.add("flashing");
  }

  function signalFound() {
    try { if (navigator.vibrate) navigator.vibrate(120); } catch (err) { /* not supported */ }
    beep();
    flash();
  }

  function scan() {
    state.busy = true;
    decodeTarget().then((text) => {
      state.busy = false;
      if (!state.camera || state.pending) return;
      const number = partFromCode(text);
      if (!number) return;
      if (number === state.ignore && Date.now() < state.ignoreUntil) return;
      state.ignore = null;
      state.pending = true;
      el("part-number").value = number;
      setScanStatus("Found part " + number + "…");
      lookup(number).then((result) => {
        if (!state.camera) return;
        if (!result.ok) {
          state.pending = false;
          if (result.error) setScanStatus(result.error + " Keep scanning.");
          return;
        }
        el("scanner").hidden = true;
        signalFound();
      });
    });
  }

  function frame(now) {
    if (!state.camera) return;
    if (!state.pending) {
      drawView();
      if (!state.busy && now - state.lastDecode >= 200) {
        state.lastDecode = now;
        scan();
      }
    }
    state.frame = requestAnimationFrame(frame);
  }

  function startCamera() {
    if (!state.audio) {
      try { state.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { state.audio = null; }
    }
    if (state.audio && state.audio.state === "suspended") state.audio.resume();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showScanner("This browser can't use the camera here. Type the part number instead.");
      return;
    }
    showScanner("Starting camera…");
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    })
      .then((stream) => {
        state.stream = stream;
        state.camera = true;
        const video = el("scan-video");
        video.srcObject = stream;
        return video.play();
      })
      .then(() => {
        setScanStatus("Point the camera at a QR code.");
        state.frame = requestAnimationFrame(frame);
      })
      .catch((err) => {
        stopCamera();
        showScanner("Camera unavailable (" + (err && err.name ? err.name : "error") + "). Type the part number instead.");
      });
  }

  // Runs until the page is left. The camera stays on through the inventory entry.
  function stopCamera() {
    state.camera = false;
    state.pending = false;
    if (state.frame) cancelAnimationFrame(state.frame);
    state.frame = null;
    if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
    state.stream = null;
    el("scan-video").srcObject = null;
    el("scanner").hidden = true;
  }

  el("camera-btn").addEventListener("click", () => {
    if (!state.camera) { startCamera(); return; }
    if (state.pending) {
      // A fresh scan without an entry: drop the found part and go back to the preview.
      state.pending = false;
      hidePart();
      el("part-number").value = "";
      showScanner("Point the camera at a QR code.");
    }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") stopCamera();
  });
  window.addEventListener("pagehide", stopCamera);

  el("part-number").focus();
})();
</script>
{% endblock %}
